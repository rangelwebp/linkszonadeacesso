<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Meus Links</title>
		<!-- Tailwind CSS CDN -->
		<script src="https://cdn.tailwindcss.com"></script>
	</head>
	<body
		class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
		<!-- Container Principal (Estilo Linktree) -->
		<main class="w-full max-w-md mx-auto flex flex-col items-center">
			<!-- Foto de Perfil / Avatar -->
			<div
				class="w-24 h-24 rounded-full bg-gradient-to-tr from-emerald-500 to-teal-400 p-1 mb-4 shadow-lg shadow-emerald-900/20">
				<img
					src="https://scontent.cdninstagram.com/v/t51.75761-19/503047374_17907355236158573_6814656504768665271_n.jpg?stp=dst-jpg_s150x150_tt6&_nc_cat=105&ccb=7-5&_nc_sid=f7ccc5&efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLnd3dy4xMDgwLkMzIn0%3D&_nc_ohc=G4d0hsYU8cwQ7kNvwE7yFSf&_nc_oc=Adp-tLurLDEkOOotkho0SoX78BWK-xR-GB-lex1tL5KNjsBMjG7Aad-wsSKLqgbEqJjFNa4IRZ9b3dBo5K7zrp_E&_nc_zt=24&_nc_ht=scontent.cdninstagram.com&_nc_gid=qulhQudaV7BbizwRa0WqIA&_nc_ss=7b6a8&oh=00_AQP5KiYGO2MPOJX6pnEUB3ivyDWusn0ZwR5Tdw_zP_viDw&oe=6AE1CE77"
					alt="Zona de Acesso"
					class="w-full h-full object-cover rounded-full bg-slate-900" />
			</div>

			<!-- Nome / Título -->
			<h1 class="text-xl font-bold mb-1 tracking-tight">
				Futebol Português by Zona de Acesso
			</h1>
			<p class="text-sm text-slate-400 mb-8 text-center">
				🇧🇷 O futebol português, de brasileiro para brasileiro
			</p>

			<!-- Lista de Botões -->
			<div class="w-full flex flex-col gap-4">
				<!-- Botão 1: Canal do WhatsApp (Redirecionando para a rota /grupo) -->
				<a
					href="/grupo"
					class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-4 px-6 rounded-xl text-center transition-all duration-200 shadow-lg shadow-emerald-900/30 flex items-center justify-center gap-3 group">
					<span class="text-lg">💬</span>
					<span>Entrar no Canal do WhatsApp</span>
				</a>

				<!-- Botão 2: Exemplo de Outro Link -->
				<a
					href="https://www.instagram.com/zonadeacesso/"
					target="_blank"
					class="w-full bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 text-slate-200 font-medium py-4 px-6 rounded-xl text-center transition-all duration-200 flex items-center justify-center gap-3">
					<span class="text-lg"></span>
					<span>Instagram</span>
				</a>

				<!-- Botão 3: Exemplo de Rede Social -->
				<a
					href="https://x.com/zonadeacesso"
					target="_blank"
					class="w-full bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 text-slate-200 font-medium py-4 px-6 rounded-xl text-center transition-all duration-200 flex items-center justify-center gap-3">
					<span class="text-lg"></span>
					<span>Twitter/X</span>
				</a>
			</div>
		</main>
	</body>
</html>
